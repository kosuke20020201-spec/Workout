function impShot(){let j;try{j=JSON.parse(sj.value)}catch(e){return alert('JSONとして読めへん')}
const days=Array.isArray(j)?j:(j.days||[j]),out=[],miss=[],txt=[];
for(const d of days){const t=Date.parse(d.date+'T12:00:00');if(isNaN(t)){miss.push('日付不明: '+d.date);continue}
const it=[];txt.push('■ '+d.date);
for(const x of d.items||[]){const k=nm(x.read||''),e=EXB[x.ex]||(x.ex===undefined?(EX.find(e=>e.k.includes(k))||EX.find(e=>e.k.some(a=>k.length>2&&(k.includes(a)||a.includes(k))))):null);
const ss=(x.sets||[]).map(q=>({w:+q.w||0,r:+q.r,...(q.n?{n:q.n}:{})})).filter(q=>q.r>0);
const sl=ss.map(q=>(q.w?q.w+'kg':'BW')+'×'+q.r+(q.n?'('+q.n+')':'')).join(', ');
if(!e){miss.push(x.read);txt.push('  ✕ '+x.read+'（対応する種目なし→飛ばす）: '+sl);continue}
it.push({ex:e.id,s:ss});txt.push('  ○ '+x.read+' → '+e.n+': '+sl)}
if(it.length)out.push({id:'scr'+d.date,t,sp:'imp',it,date:d.date})}
if(!out.length)return alert('取り込める記録がないで\n'+txt.join('\n'));
const dup=out.filter(o=>D.ses.some(s=>s.id!=o.id&&ldate(s.t)==o.date)).map(o=>o.date);
if(!confirm('こう読み取った:\n'+txt.join('\n')+(dup.length?'\n\n⚠ '+dup.join(',')+' は別の記録がすでにある（重複するかも）':'')+'\n\nこの内容で取り込む？'))return;
const ids=new Set(out.map(o=>o.id));out.forEach(o=>delete o.date);
D.ses=D.ses.filter(s=>!ids.has(s.id)).concat(out);save();draw();alert('取り込んだ。'+(miss.length?'\n飛ばした: '+miss.join(' / '):''))}
