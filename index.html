<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>全身法 Workout Reference</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fa;color:#172033}header{background:#111827;color:white;padding:24px 18px;position:sticky;top:0}h1{font-size:22px;margin:0 0 6px}.sub{font-size:13px;opacity:.8}main{max-width:760px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:12px 6px;background:#e5e7eb;font-weight:700}.active{background:#111827;color:white}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}.title{display:flex;justify-content:space-between}.title h2{margin:0}.badge{font-size:12px;padding:5px 9px;border-radius:99px;background:#eef2ff;color:#3730a3;font-weight:800}.meta,.purpose{font-size:13px;color:#667085;line-height:1.5}.exercise{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:14px 0;border-top:1px solid #edf0f4}.num{width:30px;height:30px;border-radius:50%;background:#f0f2f5;display:grid;place-items:center;font-weight:800}.name{font-weight:750}.sets{font-weight:800;white-space:nowrap}.note{background:#f8fafc;border-left:4px solid #111827;padding:12px;border-radius:8px;font-size:13px;line-height:1.55}footer{text-align:center;color:#98a2b3;font-size:12px;padding:8px 0 24px}
</style></head><body><header><h1>全身法 Workout Reference</h1><div class="sub">週2〜3回 / 1回16セット / 約1時間〜1時間15分</div></header><main><div class="tabs" id="tabs"></div><section class="card" id="content"></section><section class="card"><div class="note"><b>ローテーション：</b>A → B → C の順。週2回でも次回は続きから。</div></section><footer>メニュー確認専用。重量・回数・履歴は記録しません。</footer></main><script>
const P={
A:{d:"月曜",l:"強",x:[
["スクワット",3,"脚を最優先。最も体力のある日に高負荷で行う。"],
["ベンチプレス",3,"胸の高重量種目。疲労が少ないうちに行う。"],
["ローイング系",3,"背中の厚みを狙い、比較的高重量で行う。"],
["ミリタリープレス",3,"肩のプレス種目。前部〜中部を重めに狙う。"],
["インクラインカール",2,"二頭。伸ばされた位置から刺激する。"],
["オーバーヘッド・トライセプス・エクステンション",2,"三頭。特に長頭を狙う。"]]},
B:{d:"水曜",l:"中",x:[
["インクラインDBプレス",3,"胸を最優先。ベンチとは角度を変える。"],
["ラットプルダウン",3,"背中。縦引きで広がりを狙う。"],
["レッグプレス",3,"脚。全身疲労を抑えて刺激する。"],
["ラテラルレイズ",3,"肩中部を狙い、肩幅を作る。"],
["プリーチャーカール",2,"二頭。肘を固定して集中する。"],
["ケーブル・トライセプス・プレスダウン",2,"三頭。安定した軌道で収縮を狙う。"]]},
C:{d:"金曜",l:"弱",x:[
["チェストサポートロー",3,"背中を最優先。体幹への負担を抑える。"],
["マシンチェストプレス",3,"胸。安定性を優先して疲労を抑える。"],
["レッグエクステンション",3,"脚。全身疲労を抑えて大腿四頭筋を狙う。"],
["ケーブルYレイズ",3,"肩。軽めで肩甲骨の動きも丁寧に狙う。"],
["ハンマーカール",2,"二頭＋腕橈骨筋に刺激を入れる。"],
["ロープ・トライセプス・プレスダウン",2,"三頭。金曜は比較的軽めにする。"]]}};
let cur="A";function draw(){tabs.innerHTML=["A","B","C"].map(k=>`<button class="tab ${k==cur?"active":""}" onclick="cur='${k}';draw()">${k}：${P[k].d}・${P[k].l}</button>`).join("");let p=P[cur];content.innerHTML=`<div class="title"><h2>${cur}：${p.d}・${p.l}</h2><span class="badge">16セット</span></div><div class="meta">${cur=="A"?"休みの日で最も体力がある前提。脚を最優先。":cur=="B"?"中程度。胸を最初にして疲労と刺激のバランスを取る。":"木曜の疲労を考慮し、疲労を残しにくくする。"}</div>`+p.x.map((a,i)=>`<div class="exercise"><div class="num">${i+1}</div><div><div class="name">${a[0]}</div><div class="purpose">${a[2]}</div></div><div class="sets">${a[1]} set</div></div>`).join("")}draw();
</script></body></html>
